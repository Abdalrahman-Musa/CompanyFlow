<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompanyFlow Portal</title>
<meta name="description" content="CompanyFlow — HR & Recruitment Screening Assistant: candidate, employee and HR staff portal.">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6d68;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#1f4fa8; --accent-ink:#ffffff; --accent-soft:#e6eefb;
  --s1:#2a78d6; --s2:#eb6834;
  --b1:#86b6ef; --b2:#3987e5; --b3:#256abf; --b4:#104281;
  --good:#0ca30c; --good-ink:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --radius:12px;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#9a988f;
    --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --accent:#6f9cf0; --accent-ink:#0b1630; --accent-soft:#1d2a44;
    --s1:#3987e5; --s2:#d95926;
    --b1:#9ec5f4; --b2:#5598e7; --b3:#2a78d6; --b4:#184f95;
    --good-ink:#0ca30c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#9a988f;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#6f9cf0; --accent-ink:#0b1630; --accent-soft:#1d2a44;
  --s1:#3987e5; --s2:#d95926;
  --b1:#9ec5f4; --b2:#5598e7; --b3:#2a78d6; --b4:#184f95;
  --good-ink:#0ca30c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:17px}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;min-width:0}
.who span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.role-hr{border-color:transparent;background:var(--accent);color:var(--accent-ink)}
.pill.role-employee{background:var(--accent-soft);color:var(--ink)}
.pill.demo{background:#fff3d6;color:#6b4a00;border-color:#f3d48a}
:root[data-theme="dark"] .pill.demo{background:#3a2e10;color:#f6d58a;border-color:#5b4716}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{border-color:var(--axis)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
main{padding:18px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px;color:var(--ink-2);font-weight:650;text-transform:none}
.sub{color:var(--ink-2);margin:0 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .lab{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .note{font-size:12px;color:var(--muted)}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=url],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--page);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:140px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.55;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--critical);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{background:color-mix(in srgb,var(--critical) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--critical) 45%,transparent);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px}
.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 45%,transparent);padding:10px 12px;border-radius:10px;font-size:14px}
.login{max-width:440px;margin:6vh auto 0}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.adv summary{cursor:pointer;color:var(--ink-2);font-size:13px;margin-top:14px}
.demo-accounts{font-size:12.5px;color:var(--ink-2);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.demo-accounts code{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-2);font-weight:650;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.badge .dot{width:8px;height:8px;border-radius:50%}
.jobcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.job h2{margin-bottom:2px}
.job .meta{font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface-2)}
/* chat */
.chat{display:flex;flex-direction:column;height:min(70vh,640px)}
.chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat form input{flex:1}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink);white-space:normal}
.plan ol{margin:6px 0 10px;padding-left:20px}
.plan li{margin:4px 0}
.tag-c{font-size:11px;font-weight:700;color:#7a3a14;background:#fde3d6;border-radius:6px;padding:1px 6px;margin-left:6px}
:root[data-theme="dark"] .tag-c{color:#ffc6a6;background:#4a2414}
/* timeline */
.timeline{list-style:none;margin:6px 0 0;padding:0}
.timeline li{display:flex;gap:10px;padding:4px 0;font-size:13.5px}
.timeline li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:8px;min-height:120px}
.col h3{display:flex;justify-content:space-between;margin:2px 4px 8px;font-size:13px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;font-size:13px}
.kcard:hover{border-color:var(--axis)}
.kcard .t{display:flex;justify-content:space-between;gap:6px;font-weight:650}
.kcard .s{color:var(--ink-2);font-size:12px}
/* drawer */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(720px,100%);background:var(--page);overflow-y:auto;padding:18px 16px 40px;border-left:1px solid var(--line)}
.crit{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 64px;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.ev{font-size:12.5px;color:var(--ink-2);grid-column:1/-1;margin-top:-2px}
pre.resume{white-space:pre-wrap;font-size:12.5px;background:var(--surface-2);padding:12px;border-radius:10px;max-height:320px;overflow:auto}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:6px 9px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tview{margin-top:8px}
.tview summary{font-size:12.5px;color:var(--ink-2);cursor:pointer}
.status-flag{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-2)}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:12px;padding:18px 0 30px;border-top:1px solid var(--line)}
@media (max-width:600px){header.top .who span.name,.brand small,.pill.demo{display:none}.brand{font-size:15px}.iconbtn{white-space:nowrap}.msg{max-width:92%}.crit{grid-template-columns:1fr 1fr 54px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 20.5c2.2 2.6 5.8 3.4 8.9 2.1M23 11.5c-2.2-2.6-5.8-3.4-8.9-2.1M9.5 11.5h6M16.5 20.5h6" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <div>CompanyFlow<br><small>HR &amp; Recruitment Assistant</small></div>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="iconbtn" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle theme">☾</button>
    <button class="iconbtn hidden" id="logoutBtn">Log out</button>
  </div>
</header>

<div class="wrap">
  <nav class="tabs hidden" id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <footer>CompanyFlow · capstone project (DEPI Generative &amp; Agentic AI Systems) · UI visibility is a convenience — every permission is enforced server-side in n8n + Postgres.</footer>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="shade" data-close></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-label="Application details"><div id="drawerBody"></div></aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   CompanyFlow portal — one file, no build step.
   Talks to the n8n webhooks: /cf/auth, /cf/portal, /cf/hr, /cf/hr/copilot
   The session token lives in memory only (not localStorage) — refresh = log in again.
   ===================================================================== */
const S = { base: '', token: null, user: null, demo: false, tab: null, chatIds: {}, includeDemo: true };
const store = {
  get(k, d) { try { const v = localStorage.getItem('cf.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cf.' + k, v); } catch (e) {} },
};
S.base = new URLSearchParams(location.search).get('api') || store.get('base', '');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n === null || n === undefined || n === '' || Number.isNaN(Number(n)) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 });
const dt = s => s ? new Date(s).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Cairo' }) : '—';
const day = s => s ? new Date(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'Africa/Cairo' }) : '—';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- theme ---------- */
(function () {
  const saved = store.get('theme', '');
  if (saved) document.documentElement.dataset.theme = saved;
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set('theme', next);
    if (S.tab) render();
  };
})();

/* ---------- API ---------- */
async function api(path, body) {
  if (S.demo) return Demo.handle(path, body || {});
  if (!S.base) throw new Error('Set the n8n webhook base URL first (Settings below the login form).');
  const res = await fetch(S.base.replace(/\/+$/, '') + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: JSON.stringify(body || {}),
  });
  let data = null; try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401 && S.token) { logout('Your session expired. Please log in again.'); throw new Error('Session expired'); }
  if (!res.ok) { const m = data && (data.message || (data.details && data.details.join('; ')) || (data.reasons && data.reasons.join('; ')) || data.error); const e = new Error(m || ('HTTP ' + res.status)); e.status = res.status; e.data = data; throw e; }
  return data;
}

/* ---------- auth ---------- */
function setSession(token, user, demo) {
  S.token = token; S.user = user; S.demo = !!demo; S.chatIds = {};
  $('#logoutBtn').classList.remove('hidden');
  $('#who').innerHTML = `<span class="name">${esc(user.name)}</span><span class="pill role-${esc(user.role)}">${esc(user.role === 'hr' ? 'HR staff' : user.role)}</span>${demo ? '<span class="pill demo">Demo data</span>' : ''}`;
  S.tab = tabsFor(user.role)[0].id; renderTabs(); render();
}
function logout(msg) {
  S.token = null; S.user = null; S.demo = false; S.tab = null;
  $('#logoutBtn').classList.add('hidden'); $('#who').innerHTML = ''; $('#tabs').classList.add('hidden');
  renderLogin(msg);
}
$('#logoutBtn').onclick = () => logout();

function renderLogin(msg) {
  const m = $('#main');
  m.innerHTML = `
  <div class="login">
    <div class="card pad">
      <h1>Welcome</h1>
      <p class="sub">Candidates can create an account. Employees and HR staff use the account HR created for them.</p>
      <div class="seg" role="group" aria-label="Login or register"><button id="segL" aria-pressed="true">Log in</button><button id="segR" aria-pressed="false">Create candidate account</button></div>
      <form id="authForm" autocomplete="on">
        <div id="regOnly" class="hidden"><label class="f" for="fn">Full name</label><input id="fn" type="text" autocomplete="name"></div>
        <label class="f" for="em">Email</label><input id="em" type="email" required autocomplete="username">
        <label class="f" for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password" minlength="1">
        <p class="small muted hidden" id="pwHint">At least 10 characters, with letters and numbers.</p>
        <div id="authMsg" style="margin-top:10px">${msg ? `<div class="err">${esc(msg)}</div>` : ''}</div>
        <div class="row" style="margin-top:14px"><button class="btn" id="authBtn" type="submit">Log in</button><button class="btn ghost" type="button" id="demoBtn">Explore with demo data</button></div>
      </form>
      <details class="adv" ${S.base ? '' : 'open'}><summary>Settings — n8n webhook base URL</summary>
        <label class="f" for="base">Production webhook base URL</label>
        <input id="base" type="url" placeholder="https://your-team.app.n8n.cloud/webhook" value="${esc(S.base)}">
        <p class="small muted">Find it in any CompanyFlow webhook node → Production URL, without the path (ends in <code>/webhook</code>).</p>
      </details>
      <div class="demo-accounts">Seeded demo accounts (change the passwords before real use): <br>
        HR <code>hr@companyflow.test</code> · Employee <code>employee@companyflow.test</code> · Candidate <code>candidate@companyflow.test</code></div>
    </div>
  </div>`;
  let mode = 'login';
  const setMode = md => { mode = md; $('#segL').setAttribute('aria-pressed', md === 'login'); $('#segR').setAttribute('aria-pressed', md === 'register');
    $('#regOnly').classList.toggle('hidden', md === 'login'); $('#pwHint').classList.toggle('hidden', md === 'login'); $('#authBtn').textContent = md === 'login' ? 'Log in' : 'Create account'; };
  $('#segL').onclick = e => { e.preventDefault(); setMode('login'); };
  $('#segR').onclick = e => { e.preventDefault(); setMode('register'); };
  $('#base').onchange = e => { S.base = e.target.value.trim(); store.set('base', S.base); };
  $('#demoBtn').onclick = () => chooseDemo();
  $('#authForm').onsubmit = async e => {
    e.preventDefault(); S.base = $('#base').value.trim(); store.set('base', S.base);
    const btn = $('#authBtn'); btn.disabled = true; $('#authMsg').innerHTML = '';
    try {
      const body = { action: mode, email: $('#em').value.trim(), password: $('#pw').value };
      if (mode === 'register') body.full_name = $('#fn').value.trim();
      const r = await api('/cf/auth', body);
      setSession(r.token, r.user, false);
    } catch (err) {
      const map = { invalid_credentials: 'Wrong email or password.', account_locked: 'Too many failed attempts — the account is locked for 15 minutes.', email_taken: 'An account with this email already exists.' };
      $('#authMsg').innerHTML = `<div class="err">${esc(map[err.data && err.data.error] || err.message)}</div>`;
    } finally { btn.disabled = false; }
  };
}
function chooseDemo() {

/* ---------- chat (candidates, employees, HR copilot) ---------- */
function md(s) { // tiny, escape-first markdown: **bold**, bullet lines
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[-*•]\s+/gm, '• ');
}
function chatShell(m, title, sub, suggestions, extra) {
  m.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${sub}</p>${extra || ''}<div class="card chat"><div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="suggest">${suggestions.map(s => `<button type="button">${esc(s)}</button>`).join('')}<button type="button" id="newChat" title="Start a new conversation">＋ New chat</button></div>
  <form id="cf"><input id="ci" type="text" autocomplete="off" placeholder="Type your message…" maxlength="2000" aria-label="Message"><button class="btn">Send</button></form></div>`;
}
function addMsg(who, html) { const box = $('#msgs'); const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html; box.appendChild(d); box.scrollTop = box.scrollHeight; return d; }
function viewChat(kind) {
  const m = $('#main');
  const cand = kind === 'assistant';
  chatShell(m, cand ? 'Careers assistant' : 'HR Policy Assistant',
    cand ? 'Ask about open roles, the difference between similar roles, your application status, or interview slots once you are shortlisted.'
         : 'Answers come only from the CompanyFlow Employee Handbook, with section references. Anything not in the handbook goes to hr@companyflow.example.',
    cand ? ['What is the difference between SOC-L1 and SOC-L2?', 'What is the status of my application?', 'Show me interview slots']
         : ['How many annual leave days do I get?', 'When is salary paid?', 'How do I report a phishing email?']);
  S.chatIds[kind] = S.chatIds[kind] || 'c' + Date.now().toString(36);
  addMsg('sys', 'Conversation is remembered for this chat. Press “New chat” to start over.');
  wireChat(async text => { const r = await api('/cf/portal', { action: 'chat', message: text, chat_id: S.chatIds[kind] }); return md(r.reply); }, kind);
}
function wireChat(send, kind) {
  const form = $('#cf'), input = $('#ci');
  const go = async text => {
    if (!text.trim()) return; addMsg('me', esc(text)); input.value = '';
    const t = addMsg('bot', '<span class="spin"></span>'); form.querySelector('button').disabled = true;
    try { t.innerHTML = await send(text); } catch (e) { t.innerHTML = `<span style="color:var(--critical)">${esc(e.message)}</span>`; }
    finally { form.querySelector('button').disabled = false; input.focus(); $('#msgs').scrollTop = 1e9; }
  };
  form.onsubmit = e => { e.preventDefault(); go(input.value); };
  document.querySelectorAll('.suggest button:not(#newChat)').forEach(b => b.onclick = () => go(b.textContent));
  $('#newChat').onclick = () => { S.chatIds[kind] = 'c' + Date.now().toString(36); $('#msgs').innerHTML = ''; addMsg('sys', 'New conversation started.'); };
}

/* ---------- HR copilot with plan → approve → execute ---------- */
function viewCopilot() {
  const m = $('#main');
  chatShell(m, 'HR Copilot', 'Multi-step recruitment tasks. With “Plan first” the copilot proposes a plan you approve before anything changes.',
    ['Shortlist the top 3 SOC-L1 candidates and offer them interview slots', 'Which candidates need attention and why?', 'Compare the top two DA-JR candidates'],
    `<div class="row" style="margin-bottom:10px"><label class="row small"><input type="checkbox" id="planFirst" checked> Plan first (review before executing)</label></div>`);
  S.chatIds.copilot = S.chatIds.copilot || 'hr';
  addMsg('sys', 'Every request, approval and executed step is written to the audit log.');
  wireChat(async text => {
    const plan = $('#planFirst').checked;
    if (!plan) { const r = await api('/cf/hr/copilot', { mode: 'chat', message: text }); return md(r.reply) + toolsLine(r.tools_used); }
    const r = await api('/cf/hr/copilot', { mode: 'plan', message: text });
    const p = r.plan || {};
    const id = 'pl' + r.plan_id;
    setTimeout(() => {
      const b = document.getElementById(id); if (!b) return;
      b.onclick = async () => {
        b.disabled = true; b.innerHTML = '<span class="spin"></span> Executing…';
        const t = addMsg('bot', '<span class="spin"></span> Running the approved plan…');
        const note = b.nextElementSibling;
        try { const x = await api('/cf/hr/copilot', { mode: 'execute', plan_id: r.plan_id }); t.innerHTML = md(x.reply) + toolsLine(x.tools_used); b.textContent = 'Executed ✓'; if (note) note.textContent = 'Approved and executed — see the audit log.'; }
        catch (e) { t.innerHTML = `<span style="color:var(--critical)">${esc(e.message)}</span>`; b.textContent = 'Failed'; if (note) note.textContent = 'Execution failed — check the audit log for partial changes.'; }
      };
    }, 0);
    return `<div class="plan"><b>Proposed plan #${esc(r.plan_id)}</b> — ${esc(p.goal || '')}
      <ol>${(p.steps || []).map(s => `<li><code>${esc(s.tool)}</code> ${esc(s.purpose)} <span class="muted small">(${esc(s.inputs)})</span>${s.consequential ? '<span class="tag-c">changes data</span>' : ''}</li>`).join('')}</ol>
      ${(p.assumptions || []).length ? `<div class="small muted">Assumptions: ${p.assumptions.map(esc).join('; ')}</div>` : ''}
      ${(p.risks || []).length ? `<div class="small muted">Risks: ${p.risks.map(esc).join('; ')}</div>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn small" id="${id}">Approve &amp; execute</button><span class="small muted">Nothing has changed yet.</span></div></div>`;
  }, 'copilot');
}
const toolsLine = t => t && t.length ? `<div class="small muted" style="margin-top:6px">Tools used: ${t.map(esc).join(', ')}</div>` : '';

/* ---------- charts (hand-built SVG, hover tooltips, table fallback) ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function lineChart(el, rows, series, opts = {}) {
  const W = Math.max(300, Math.round(el.clientWidth || 640)), H = 230, L = 34, R = 70, T = 12, B = 26;
  const max = niceMax(Math.max(1, ...rows.flatMap(r => series.map(s => r[s.key] || 0))));
  const x = i => L + (i * (W - L - R)) / Math.max(1, rows.length - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 2, max];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'line chart')}">`;
  ticks.forEach(t => { svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${css('--line')}" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="${css('--muted')}">${fmt(t)}</text>`; });
  const step = W < 480 ? 14 : 7; // x labels counted back from the latest day so the last label never collides
  rows.forEach((r, i) => { const k = rows.length - 1 - i; if (k % step === 0 && (i === rows.length - 1 || i > 1)) svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === rows.length - 1 ? 'end' : 'middle'}" font-size="11" fill="${css('--muted')}">${esc(day(r.day))}</text>`; });
  const last = rows[rows.length - 1] || {};
  const ends = series.map(s => ({ s, y: y(last[s.key] || 0) + 4 })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13; // keep end labels apart
  series.forEach(s => {
    const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[s.key] || 0).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${css(s.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  ends.forEach(e => { svg += `<text x="${W - R + 8}" y="${e.y}" font-size="11.5" fill="${css('--ink-2')}">${esc(e.s.name)}</text>`; });
  svg += `<line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${css('--axis')}" stroke-width="1" opacity="0"/>`;
  series.forEach((s, k) => { svg += `<circle id="xd${k}" r="4.5" fill="${css(s.color)}" stroke="${css('--surface')}" stroke-width="2" opacity="0"/>`; });
  svg += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg>`;
  el.innerHTML = `<div class="legend">${series.map(s => `<span><i style="background:${css(s.color)}"></i>${esc(s.name)}</span>`).join('')}</div><div class="chart">${svg}<div class="tip"></div></div>
   <details class="tview"><summary>Show as table</summary><div class="tablewrap"><table><thead><tr><th>Day</th>${series.map(s => `<th class="num">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><td>${day(r.day)}</td>${series.map(s => `<td class="num">${fmt(r[s.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  const c = el.querySelector('.chart'), svgEl = c.querySelector('svg'), tip = c.querySelector('.tip');
  const move = ev => {
    const pt = svgEl.getBoundingClientRect(); const sx = (ev.clientX - pt.left) * (W / pt.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(((sx - L) / (W - L - R)) * (rows.length - 1))));
    const xx = x(i); const xh = svgEl.querySelector('#xh'); xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('opacity', 1);
    series.forEach((s, k) => { const d = svgEl.querySelector('#xd' + k); d.setAttribute('cx', xx); d.setAttribute('cy', y(rows[i][s.key] || 0)); d.setAttribute('opacity', 1); });
    tip.innerHTML = `<b>${day(rows[i].day)}</b><br>` + series.map(s => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${css(s.color)};margin-right:5px"></span>${esc(s.name)}: <b>${fmt(rows[i][s.key])}</b>`).join('<br>');
    tip.style.opacity = 1; const px = (xx / W) * pt.width; tip.style.left = Math.min(pt.width - 150, px + 12) + 'px'; tip.style.top = '6px';
  };
  svgEl.querySelector('#hit').addEventListener('pointermove', move);
  svgEl.querySelector('#hit').addEventListener('pointerleave', () => { tip.style.opacity = 0; svgEl.querySelector('#xh').setAttribute('opacity', 0); series.forEach((s, k) => svgEl.querySelector('#xd' + k).setAttribute('opacity', 0)); });
}
function barList(el, rows, opts = {}) { // horizontal bars: rows [{label, value, color?, note?}]
  const max = Math.max(1, ...rows.map(r => r.value));
  el.innerHTML = `<div class="chart">${rows.map((r, i) => `<div class="crit" style="grid-template-columns:minmax(90px,140px) 1fr 70px;border:0;padding:5px 0" data-i="${i}">
      <span class="small">${esc(r.label)}</span>
      <span class="meter" style="height:14px;border-radius:4px"><i style="width:${Math.max(r.value ? 2 : 0, (100 * r.value) / max)}%;background:${r.color || css('--s1')};border-radius:0 4px 4px 0"></i></span>
      <span class="small" style="text-align:right;font-variant-numeric:tabular-nums">${fmt(r.value)}${r.note ? ` <span class="muted">${esc(r.note)}</span>` : ''}</span></div>`).join('')}<div class="tip"></div></div>`;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('[data-i]').forEach(d => {
    d.addEventListener('pointerenter', () => { const r = rows[d.dataset.i]; tip.innerHTML = `<b>${esc(r.label)}</b>: ${fmt(r.value)}${r.tip ? '<br>' + esc(r.tip) : ''}`; tip.style.opacity = 1; tip.style.left = '150px'; tip.style.top = (d.offsetTop - 30) + 'px'; });
    d.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
  });
}

function effBlock(e) {

function bandBadge(b) {

}
